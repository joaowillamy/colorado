AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Atendente de WhatsApp com Amazon Bedrock (SNS -> SQS -> Lambda)

Parameters:
  KbId:
    Type: String
    Description: ID do Knowledge Base
  GuardrailId:
    Type: String
    Default: "off"
  GuardrailVersion:
    Type: String
    Default: DRAFT
  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
  LinkPost:
    Type: String
    Default: "{LINK_POST}"
    Description: Link do post do LinkedIn enviado na mensagem de limite
  MaxPerguntas:
    Type: Number
    Default: 4
  AlertaEmail:
    Type: String
    Default: none
    Description: E-mail para alarmes e orçamento ("none" desliga e-mail e orçamento)
  LimiteAtaquePorMinuto:
    Type: Number
    Default: 100
    Description: Mensagens/minuto na fila que disparam o disjuntor (para o consumo)
  OrcamentoMensalUsd:
    Type: Number
    Default: 20

Conditions:
  TemEmail: !Not [!Equals [!Ref AlertaEmail, none]]

Resources:
  # Tabela única: CONVERSA#, MSG#, ALUNO#
  Tabela:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # O End User Messaging Social publica aqui (tópico padrão; FIFO não é suportado).
  # Ao ligar "Message and event publishing" no console, escolha este tópico.
  Topico:
    Type: AWS::SNS::Topic

  # Permite que o End User Messaging Social publique no tópico.
  TopicoPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Topico]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PermitirEndUserMessagingSocial
            Effect: Allow
            Principal: { Service: social-messaging.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref Topico
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  Dlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  Fila:
    Type: AWS::SQS::Queue
    Properties:
      # >= 6x o timeout da Lambda (recomendação da AWS)
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt Dlq.Arn
        maxReceiveCount: 5

  FilaPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref Fila]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt Fila.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Ref Topico }

  Assinatura:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Topico
      Protocol: sqs
      Endpoint: !GetAtt Fila.Arn

  Funcao:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      # RAG + até 5 chamadas Converse (loop de tools) cabem mal em 30 s
      Timeout: 60
      MemorySize: 512
      # Limita chamadas simultâneas ao Bedrock (cota de requisições por minuto)
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          TABELA: !Ref Tabela
          KB_ID: !Ref KbId
          MODEL_ID: !Ref ModelId
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
          LOCK_SEG: "60"
          LINK_POST: !Ref LinkPost
          MAX_PERGUNTAS: !Ref MaxPerguntas
          RATE_MAX_POR_MINUTO: "5"
          ABUSO_MAX_ESTOUROS: "3"
          ABUSO_JANELA_SEG: "3600"
          AVISO_BLOQUEIO_SEG: "86400"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Tabela }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
                - arn:aws:bedrock:*::foundation-model/*
            - Effect: Allow
              Action: [bedrock:Retrieve]
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KbId}
            # O guardrail usa tier STANDARD (português), que roda via perfil cross-region:
            # além do guardrail, precisa do guardrail-profile em cada região de destino.
            - Effect: Allow
              Action: [bedrock:ApplyGuardrail]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*
                - !Sub arn:aws:bedrock:us-east-1:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
                - !Sub arn:aws:bedrock:us-east-2:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
                - !Sub arn:aws:bedrock:us-west-2:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
            - Effect: Allow
              Action: [social-messaging:SendWhatsAppMessage]
              Resource: "*"
      Events:
        Sqs:
          Type: SQS
          Properties:
            Queue: !GetAtt Fila.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]

  # ── Proteção contra ataque / custo ──────────────────────────────────────
  # Só o disjuntor assina este tópico: ele desliga o consumo da fila.
  TopicoDisjuntor:
    Type: AWS::SNS::Topic

  # Alertas para humanos (e-mail), de todos os alarmes.
  TopicoAlertas:
    Type: AWS::SNS::Topic

  AlertaEmailAssinatura:
    Type: AWS::SNS::Subscription
    Condition: TemEmail
    Properties:
      TopicArn: !Ref TopicoAlertas
      Protocol: email
      Endpoint: !Ref AlertaEmail

  Disjuntor:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/disjuntor.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          FUNCAO_ALVO: !Ref Funcao
      Policies:
        - Statement:
            - Effect: Allow
              Action: [lambda:ListEventSourceMappings]
              Resource: "*"
            - Effect: Allow
              Action: [lambda:UpdateEventSourceMapping]
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*
      Events:
        Alarme:
          Type: SNS
          Properties:
            Topic: !Ref TopicoDisjuntor

  # Muitas mensagens chegando na fila por minuto: provável ataque.
  AlarmeAtaque:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-ataque
      AlarmDescription: Mensagens por minuto na fila acima do limite. O disjuntor para o consumo.
      Namespace: AWS/SQS
      MetricName: NumberOfMessagesSent
      Dimensions:
        - { Name: QueueName, Value: !GetAtt Fila.QueueName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: !Ref LimiteAtaquePorMinuto
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TopicoDisjuntor, !Ref TopicoAlertas]

  AlarmeDlq:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dlq
      AlarmDescription: Mensagens na DLQ (falharam 5 vezes).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt Dlq.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TopicoAlertas]

  AlarmeThrottle:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-throttle
      AlarmDescription: Lambda do atendente sofrendo throttling (concorrência no teto).
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - { Name: FunctionName, Value: !Ref Funcao }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TopicoAlertas]

  # Orçamento da conta inteira (não só deste stack). Só com e-mail.
  Orcamento:
    Type: AWS::Budgets::Budget
    Condition: TemEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref OrcamentoMensalUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertaEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertaEmail }]

Outputs:
  TopicoArn:
    Value: !Ref Topico
  DlqUrl:
    Value: !Ref Dlq
