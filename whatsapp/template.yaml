AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Atendente de WhatsApp com Amazon Bedrock (SNS -> SQS -> Lambda)

Parameters:
  KbId:
    Type: String
    Description: ID do Knowledge Base
  GuardrailId:
    Type: String
    Default: "off"
  GuardrailVersion:
    Type: String
    Default: DRAFT
  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6

Resources:
  # Tabela única: CONVERSA#, MSG#, ALUNO#
  Tabela:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # O End User Messaging Social publica aqui (tópico padrão; FIFO não é suportado).
  # Ao ligar "Message and event publishing" no console, escolha este tópico.
  Topico:
    Type: AWS::SNS::Topic

  # Permite que o End User Messaging Social publique no tópico.
  TopicoPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Topico]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PermitirEndUserMessagingSocial
            Effect: Allow
            Principal: { Service: social-messaging.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref Topico
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  Dlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  Fila:
    Type: AWS::SQS::Queue
    Properties:
      # >= 6x o timeout da Lambda (recomendação da AWS)
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt Dlq.Arn
        maxReceiveCount: 5

  FilaPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref Fila]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt Fila.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Ref Topico }

  Assinatura:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Topico
      Protocol: sqs
      Endpoint: !GetAtt Fila.Arn

  Funcao:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      # RAG + até 5 chamadas Converse (loop de tools) cabem mal em 30 s
      Timeout: 60
      MemorySize: 512
      # Limita chamadas simultâneas ao Bedrock (cota de requisições por minuto)
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          TABELA: !Ref Tabela
          KB_ID: !Ref KbId
          MODEL_ID: !Ref ModelId
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
          LOCK_SEG: "60"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Tabela }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
                - arn:aws:bedrock:*::foundation-model/*
            - Effect: Allow
              Action: [bedrock:Retrieve]
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KbId}
            # O guardrail usa tier STANDARD (português), que roda via perfil cross-region:
            # além do guardrail, precisa do guardrail-profile em cada região de destino.
            - Effect: Allow
              Action: [bedrock:ApplyGuardrail]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*
                - !Sub arn:aws:bedrock:us-east-1:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
                - !Sub arn:aws:bedrock:us-east-2:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
                - !Sub arn:aws:bedrock:us-west-2:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
            - Effect: Allow
              Action: [social-messaging:SendWhatsAppMessage]
              Resource: "*"
      Events:
        Sqs:
          Type: SQS
          Properties:
            Queue: !GetAtt Fila.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]

Outputs:
  TopicoArn:
    Value: !Ref Topico
  DlqUrl:
    Value: !Ref Dlq
